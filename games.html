<!DOCTYPE html>
<html>
<head>
    <title>GameTrade - Games</title>

    <style>
        body {
            margin: 0;
            background: #080b16;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        nav {
    padding: 20px 60px;
    background: #0d0918;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #24143d;
}

        nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

        nav a:hover {
    color: #b66cff;
    transform: translateY(-2px);
}

.nav-menu {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
}

        h1 {
            margin-top: 60px;
            font-size: 45px;
            text-shadow: 0 0 15px #7c3aed;
        }

        .card {
    display: inline-flex;
    flex-direction: column;
    width: 300px;
    min-height: 380px;
    margin: 15px;
    padding: 25px;
    background: #151020;
    border: 1px solid #8b3dff;
    border-radius: 14px;
    box-sizing: border-box;
    transition: 0.3s;
}
.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 0 30px rgba(139, 61, 255, 0.35);
}

        .game-image {
            width: 230px;
            height: 140px;
            object-fit: cover;
            border-radius: 15px;
            margin: 10px auto 20px;
        }

        .button {
            display: block;
            margin-top: auto;
            padding: 16px;
            background: #7c3aed;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
        }

        .button:hover {
            background: #6d28d9;
        }
        .game-card {
    transition: 0.3s;
}

.game-card:hover {
    transform: translateY(-10px) scale(1.02);
    box-shadow: 0 0 30px rgba(139, 61, 255, 0.45);
}
.game-image {
    transition: 0.3s;
}

.game-card:hover .game-image {
    transform: scale(1.05);
}
    </style>
</head>

<body>

<nav>
    <div class="nav-logo">🎮 GameTrade</div>

    <div class="nav-menu">
        <a href="index.html">HOME</a>
        <a href="games.html">GAMES</a>

        <a href="tarif.html">TARIF</a>
        <a href="order.html">ORDER</a>
        <a href="contact.html">CONTACT</a>
    </div>
</nav>

<h1>🎮 GAME TRADE</h1>

<div class="card game-card">
    <h2>🎮 Mobile Legends</h2>
    <img src="mlbb.webp" class="game-image">
    <p>Mobile Legends Middleman</p>
    <a href="middleman.html" class="button">Сонгох</a>
</div>

<div class="card game-card">
    <h2>🧱 Roblox</h2>
    <img src="Roblox.webp" class="game-image">
    <p>Roblox Middleman</p>
    <a href="middleman.html" class="button">Сонгох</a>
</div>

<div class="card game-card">
    <h2>🔫 CS2</h2>
    <img src="cs2.jpg" class="game-image">
    <p>CS2 Middleman</p>

</div>

<div class="card game-card">

    <img src="pubg.jpg" class="game-image">
    <p>PUBG Middleman</p>
    <a href="middleman.html" class="button">Сонгох</a>
</div>

</body>
</html>
