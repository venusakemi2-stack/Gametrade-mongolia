<h1>🛡️ Middleman үйлчилгээ</h1>

<div class="card">

    <h2>🎮 Тоглоом сонгоно уу</h2>

    <p>Арилжааны мэдээллээ оруулаад хүсэлт илгээнэ үү.</p>

    <select id="game">
    <option value="">🎮 Тоглоом сонгох</option>
    <option value="Mobile Legends">🎮 Mobile Legends</option>
    <option value="Roblox">🧱 Roblox</option>
    <option value="CS2">🔫 CS2</option>
    <option value="PUBG">🎯 PUBG</option>
</select>

    <input type="number" id="amount" placeholder="💰 Арилжааны дүн (₮)">

    <input type="text" id="username" placeholder="👤 Таны нэр">

    <input type="text" id="discord" placeholder="💬 Discord нэр">

    <br>

    <button class="button" onclick="sendRequest()">Хүсэлт илгээх</button>

    <div id="successMessage" class="success-message"></div>
    <a
    id="orderCheckButton"
    href="order.html"
    style="
        display:none;
        margin-top:15px;
        padding:12px 20px;
        background:#8b3dff;
        color:white;
        text-decoration:none;
        border-radius:8px;
        font-weight:bold;
    "
>
    🎫 Захиалгаа шалгах
</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://ltpsvdthypdjyuaspxyr.supabase.co";
const SUPABASE_KEY = "sb_publishable_5g3Os_4D4O6vliZXnQolyA_3_mB8LMn";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function sendRequest() {
    let game = document.getElementById("game").value;
    let amount = document.getElementById("amount").value;
    let username = document.getElementById("username").value;
    let discord = document.getElementById("discord").value; 

    if (game === "") {
        alert("Эхлээд тоглоомоо сонгоно уу!");
        return;
    }

    let orderNumber = "GT-" + Math.floor(10000 + Math.random() * 90000);
    let { data, error } = await supabaseClient
    .from("orders")
    .insert([
        {
            game: game,
            amount: amount,
            username: username,
            discord: discord,
            order_number: orderNumber
        }
    ]);

if (error) {
    alert("Алдаа гарлаа: " + error.message);
    return;
}
    let message = document.getElementById("successMessage");

message.innerHTML =
    "✅ Хүсэлт амжилттай илгээгдлээ!<br><br>" +
    "🎮 Тоглоом: " + game + "<br>" +
    "🎫 Захиалгын дугаар: <strong id='myOrderNumber'>" +
    orderNumber +
    "</strong><br><br>" +
    "<button onclick='copyOrderNumber()'>📋 GT дугаар Copy хийх</button>";
message.style.display = "block";
document.getElementById("game").value = "";
document.getElementById("amount").value = "";
document.getElementById("username").value = "";
document.getElementById("discord").value = "";
const orderCheckButton =
    document.getElementById("orderCheckButton");

orderCheckButton.style.display = "inline-block";

orderCheckButton.href =
    "order.html?order=" + encodeURIComponent(orderNumber);
}
function copyOrderNumber() {
    const orderNumber =
        document.getElementById("myOrderNumber").innerText;

    navigator.clipboard.writeText(orderNumber);

    alert("✅ GT дугаар Copy хийгдлээ!");
}
</script>
