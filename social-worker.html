
<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Нийгмийн ажилтан — School Safety</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #202636;
        }

        .login-box {
            width: 420px;
            max-width: 90%;
            padding: 40px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
        }

        .icon {
            text-align: center;
            font-size: 50px;
        }

        h1 {
            text-align: center;
            color: #3730a3;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 9px;
            color: #b91c1c;
            text-align: center;
        }

        .back {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #4f46e5;
            text-decoration: none;
        }

        .security {
            margin-top: 25px;
            padding: 15px;
            background: #eef2ff;
            border-radius: 10px;
            color: #3730a3;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 500px) {
            .login-box {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="icon">
            🛡️
        </div>

        <h1>
            Нийгмийн ажилтан
        </h1>

        <p class="description">
            Сургуулийн санал, гомдлын
            нууц хэсэгт нэвтрэх
        </p>


        <label>
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Нийгмийн ажилтны email"
        >


        <label>
            Нууц үг
        </label>

        <input
            type="password"
            id="password"
            placeholder="Нууц үг"
        >


        <button onclick="login()">
            🔐 Нэвтрэх
        </button>


        <div
            id="error"
            class="error"
        ></div>


        <div class="security">

            🔒 Энэ хэсэг нь зөвшөөрөлтэй
            нийгмийн ажилтанд зориулагдсан.

        </div>


        <a
            href="index.html"
            class="back"
        >
            ← Нүүр хуудас руу буцах
        </a>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://ltpsvdthypdjyuaspxyr.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_5g3Os_4D4O6vliZXnQolyA_3_mB8LMn";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function login() {

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            const errorBox =
                document.getElementById("error");


            errorBox.style.display = "none";


            if (!email || !password) {

                errorBox.innerText =
                    "Email болон нууц үгээ оруулна уу.";

                errorBox.style.display = "block";

                return;
            }


            const { data, error } =
                await supabaseClient.auth
                    .signInWithPassword({
                        email: email,
                        password: password
                    });


            if (error) {

    errorBox.innerText =
        "Supabase алдаа: " + error.message;

    errorBox.style.display = "block";

    return;
}


            window.location.href =
                "social-worker-dashboard.html";

        }

    </script>

</body>

</html>
